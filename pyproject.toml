[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-runtime-monitor"
dynamic = ["version"]
description = "CrowdStrike-style runtime monitor for AI coding agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Rajan Yadav", email = "rajan.conch@gmail.com" },
    { name = "GoCloudForge, Inc." },
]
maintainers = [{ name = "Rajan Yadav", email = "rajan.conch@gmail.com" }]
keywords = ["ai", "monitoring", "security", "observability", "supply-chain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "psutil>=5.9.0",
    "watchdog>=3.0",
    "cryptography>=42.0",
    # mitmproxy is the HTTPS proxy implementation that gives Vigil its
    # primary value: selective SSL inspection of AI API traffic. It is
    # a base dependency (PR #52) — not an opt-in extra — because every
    # documented use of Vigil (PRD §4, brand site, agent-detection
    # design doc) treats interception as the central capability.
    # Pre-PR-52 it was the [watch] extra; that produced a silent-
    # failure footgun where `pip install ai-runtime-monitor` shipped a
    # half-working product, observed during the new-laptop install
    # verification on 2026-05-25.
    "mitmproxy>=10.0",
]

[project.optional-dependencies]
# The [watch] extra is retained as a no-op alias so any existing
# install command `pip install "ai-runtime-monitor[watch]"` keeps
# working without producing a "no such extra" error. Remove in v0.3.
watch = []
plot = ["matplotlib>=3.5"]
security = ["sqlcipher3-binary>=0.5"]  # Optional: DB encryption at rest
all = ["matplotlib>=3.5", "sqlcipher3-binary>=0.5"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "python-Levenshtein>=0.25",
    "pre-commit>=3.0",
    "detect-secrets>=1.5",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/rajan-cforge/ai-runtime-monitor-enterprise"
Repository = "https://github.com/rajan-cforge/ai-runtime-monitor-enterprise"
Issues = "https://github.com/rajan-cforge/ai-runtime-monitor-enterprise/issues"
Changelog = "https://github.com/rajan-cforge/ai-runtime-monitor-enterprise/blob/main/CHANGELOG.md"

[project.scripts]
ai-monitor = "claude_monitoring.monitor:main"
claude-watch = "claude_monitoring.watch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claude_monitoring = ["*.html"]

[tool.setuptools_scm]
fallback_version = "0.1.0"
# Only consider release tags `v*` as version sources. Operational tags
# like `pre-c1c4` (rollback markers) trip vcs_versioning's tag parser
# and crash `pip install -e .` with an AssertionError. Filtering at
# `git describe` time keeps the install path clean.
git_describe_command = [
    "git",
    "describe",
    "--dirty",
    "--tags",
    "--long",
    "--match",
    "v[0-9]*",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Aggressive rule set per CLAUDE.md mandatory/forbidden patterns. The
# enumeration here is the authoritative list — adding a rule family means
# the new rule is desired across the codebase, with any existing
# violations either fixed immediately or tracked in docs/RUFF_WARMUP.md.
select = [
    "E",        # pycodestyle errors
    "F",        # pyflakes
    "W",        # pycodestyle warnings
    "I",        # isort (import order)
    "B",        # flake8-bugbear (common bug patterns)
    "UP",       # pyupgrade (modernization)
    "PTH",      # flake8-use-pathlib (prefer Path over os.path)
    "BLE",      # flake8-blind-except (catch bare except)
    "G",        # flake8-logging-format (proper logging)
    "DTZ",      # flake8-datetimez (timezone-aware datetimes)
    "TRY",      # tryceratops (try/except patterns)
    "PERF",     # perflint (performance anti-patterns)
    "PL",       # pylint (general)
    "RUF",      # ruff-specific
    "SIM",      # flake8-simplify
    "S",        # flake8-bandit (security)
    "TID",      # flake8-tidy-imports
]
ignore = [
    "S101",     # assert statements (we use them in tests)
    "PLR2004",  # magic values (too noisy; rely on code review)
    "TRY003",   # long exception messages (sometimes useful)
    "PERF203",  # try/except in loop (sometimes necessary)
    "PLR0913",  # too many arguments (judgment call)

    # ── Warmup ignores — see docs/RUFF_WARMUP.md ────────────────────
    # These rule codes have existing violations on the day the
    # aggressive ruleset landed. Each entry has a documented audit
    # plan (Category A genuine cleanup or Category B likely
    # false-positive). When a rule's count reaches zero, remove the
    # entry from this list — CI then enforces the rule going forward.
    # The list shrinks over time; it never grows.
    #
    # Category A — genuine technical debt (Phase 3F cleanup sprint):
    "PLC0415",  # 552 — import-outside-top-level (lazy imports)
    "BLE001",   # 191 — blind-except in scanner loops
    "S110",     #  96 — try-except-pass (intentional in scanners)
    "SIM105",   #  54 — suppressible-exception → contextlib.suppress
    "E501",     #  45 — line-too-long (URLs, regex patterns)
    "PLW1510",  #  39 — subprocess-run-without-check
    "PTH123",   #  30 — builtin-open → Path.open
    "PLR0912",  #  25 — too-many-branches (M6 monitor.py split)
    "RUF059",   #  24 — unused-unpacked-variable
    "TRY300",   #  23 — try-consider-else
    "PLR0915",  #  19 — too-many-statements (M6 target)
    "PTH101",   #  14 — os.chmod → Path.chmod
    "PERF401",  #  13 — manual list-comprehension
    "SIM117",   #  11 — multiple-with-statements (unsafe-fix)
    "PLR0911",  #   7 — too-many-return-statements (M6 target)
    "PLW0108",  #   7 — unnecessary-lambda
    "PLW0603",  #   7 — global-statement (scanner state)
    "PLW2901",  #   6 — redefined-loop-name
    "RUF005",   #   5 — collection-literal-concatenation
    "SIM102",   #   5 — collapsible-if
    "PTH110",   #   3 — os.path.exists → Path.exists
    "DTZ005",   #   2 — call-datetime-now-without-tzinfo (real bug)
    "PLR1714",  #   2 — repeated-equality-comparison
    "PLW0602",  #   2 — global-variable-not-assigned
    "PTH202",   #   2 — os.path.getsize
    "RUF003",   #   2 — ambiguous-unicode-character-comment
    "RUF015",   #   2 — unnecessary-iterable-allocation-for-first-element
    "SIM110",   #   2 — reimplemented-builtin
    "SIM114",   #   2 — if-with-same-arms
    "SIM118",   #   2 — in-dict-keys
    "PERF102",  #   1 — incorrect-dict-iterator
    "PTH108",   #   1 — os.unlink
    "PTH109",   #   1 — os.getcwd
    "PTH111",   #   1 — os.path.expanduser
    "RUF002",   #   1 — ambiguous-unicode-character-docstring
    "RUF010",   #   1 — explicit-f-string-type-conversion
    "RUF012",   #   1 — mutable-class-default (real bug)
    "RUF034",   #   1 — useless-if-else
    "SIM103",   #   1 — needless-bool
    "SIM108",   #   1 — if-else-block-instead-of-if-exp
    "SIM115",   #   1 — open-file-with-context-handler (real bug)
    #
    # Category B — likely false-positives (Phase 3F audit; permanent
    # ignore with rationale, or escalate to enforced):
    "S607",     #  39 — start-process-with-partial-path (osascript,
                #        networksetup from system PATH per macOS conv.)
    "S608",     #  33 — hardcoded-sql-expression (we use ?
                #        placeholders — likely FPs)
    "S603",     #  31 — subprocess-without-shell-equals-true (we use
                #        argv lists, the secure form — likely FPs)
    "S311",     #  14 — non-cryptographic-random in tests (FP)
    "S310",     #   5 — suspicious-url-open-usage (hardcoded trusted
                #        URLs only)
    "S105",     #   3 — hardcoded-password-string (test fixtures /
                #        config key names)
    "S112",     #   6 — try-except-continue (intentional in scanners)
    "S314",     #   2 — xml.etree on trusted cobertura XML
    "S606",     #   2 — start-process-with-no-shell (paradoxical FP
                #        — same diagnosis as S603)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S",        # security rules don't apply to tests
    "PLR2004",  # magic values are common in tests
    "PT009",    # use of assertEqual is fine
]
"scripts/**/*.py" = [
    "T201",     # print statements are fine in scripts
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.bandit]
exclude_dirs = ["tests"]
# B310 is skipped because every urlopen call uses a hardcoded loopback or
# trusted-upstream URL, never user input.
skips = ["B101", "B404", "B603", "B607", "B310"]
