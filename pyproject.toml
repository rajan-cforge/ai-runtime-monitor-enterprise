[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-runtime-monitor"
dynamic = ["version"]
description = "CrowdStrike-style runtime monitor for AI coding agents"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.9"
authors = [{ name = "GoCloudForge, Inc." }]
keywords = ["ai", "monitoring", "security", "observability", "supply-chain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "License :: Other/Proprietary License",
]
dependencies = ["psutil>=5.9.0", "watchdog>=3.0", "cryptography>=42.0"]

[project.optional-dependencies]
watch = ["mitmproxy>=10.0"]
plot = ["matplotlib>=3.5"]
security = ["sqlcipher3-binary>=0.5"]  # Optional: DB encryption at rest
all = ["mitmproxy>=10.0", "matplotlib>=3.5", "sqlcipher3-binary>=0.5"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "python-Levenshtein>=0.25",
]

[project.urls]
Homepage = "https://github.com/rajan-cforge/ai-runtime-monitor"
Repository = "https://github.com/rajan-cforge/ai-runtime-monitor"
Issues = "https://github.com/rajan-cforge/ai-runtime-monitor/issues"
Changelog = "https://github.com/rajan-cforge/ai-runtime-monitor/blob/main/CHANGELOG.md"

[project.scripts]
ai-monitor = "claude_monitoring.monitor:main"
claude-watch = "claude_monitoring.watch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claude_monitoring = ["*.html"]

[tool.setuptools_scm]
fallback_version = "0.1.0"

[tool.ruff]
target-version = "py39"
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B008: FastAPI's idiomatic pattern is `x: T = Depends(fn)` in function
# signatures. Ruff flags every call-in-default, but this is correct for
# FastAPI dependency injection and has no runtime impact (Depends() is a
# marker, not an evaluation). Ignore project-wide — applies to
# control-plane/cp/* route handlers.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.bandit]
exclude_dirs = ["tests"]
# B310 is skipped because every urlopen call uses a hardcoded loopback or
# trusted-upstream URL, never user input.
skips = ["B101", "B404", "B603", "B607", "B310"]
