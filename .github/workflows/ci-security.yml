name: CI Security
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit (CVE scan)
    runs-on: ubuntu-latest
    # Informational until the deps-upgrade PR lands. Today the env carries
    # 12 known vulnerabilities in transitive deps (urllib3, tornado, idna,
    # cryptography, flask, mitmproxy, pyopenssl, pytest) — all minor version
    # bumps. We surface them on every PR for visibility, then flip this to
    # a hard gate once the upgrade lands. Remove `continue-on-error` then.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Upgrade pip itself first — runner ships pip 26.1.1 which has
      # PYSEC-2026-196 (console_scripts path-sanitization issue);
      # pip 26.1.2 is the fix. Pre-existing upstream CVE, unrelated
      # to this PR's substance, but blocks branch-protection merge
      # gating until upgraded.
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: pip install -e ".[dev]"
      # `--skip-editable` keeps pip-audit from trying to look up the
      # local in-tree package (ai-runtime-monitor) on PyPI, which fails
      # because it's not published. `--desc` gives reviewers the CVE
      # description inline.
      #
      # `--ignore-vuln` entries below: Rajan deferral 2026-06-13 for the
      # v0.2.2 release window. See memory
      # `project_pipaudit_deferral_2026-06-13.md` for the topology
      # analysis (each bundled via mitmproxy or hits a Vigil deployment
      # that doesn't reach the vulnerable code path). Three follow-up
      # chore(deps) PRs queued. NEW advisories not in this list still
      # fail the gate -- this is a per-ID deferral, not a blanket waiver.
      #
      # Tornado-6.5.5-wave-2 suppressions (Rajan auth 2026-06-15).
      # ---------------------------------------------------------------
      # Same pattern as precedent 6120192 (2026-06-13 11-CVE batch):
      # tornado is transitive via mitmproxy; the bump is blocked by
      # mitmproxy 12.2.3's explicit cap `tornado<=6.5.5,>=6.5.0`, so a
      # direct `tornado>=6.5.6` pin in pyproject would be unresolvable.
      # See follow-up task `tornado-cve-unsuppress` — remove these three
      # when a mitmproxy release lifts the cap.
      #
      # Reachability — verified, not asserted:
      #   * `grep -rn 'tornado' src/` returns zero hits (no direct Vigil use)
      #   * mitmproxy's tornado imports are confined to
      #     `mitmproxy/tools/web/{master.py,app.py}` (mitmweb UI) and
      #     `mitmproxy/tools/console/master.py` (TUI). Vigil shells out
      #     to `mitmdump` only — never mitmweb or mitmproxy console —
      #     so the tornado-using mitmproxy code paths are never loaded.
      #   * All three CVEs hit `SimpleAsyncHTTPClient` /
      #     `CurlAsyncHTTPClient`, classes mitmdump never instantiates.
      # ---------------------------------------------------------------
      # revisit when mitmproxy lifts tornado<=6.5.5 cap
      - run: |
          pip-audit --skip-editable --desc \
            --ignore-vuln PYSEC-2026-35 \
            --ignore-vuln CVE-2026-26007 \
            --ignore-vuln GHSA-h4gh-qq45-vh27 \
            --ignore-vuln CVE-2024-12797 \
            --ignore-vuln CVE-2025-23217 \
            --ignore-vuln GHSA-63cx-g855-hvv4 \
            --ignore-vuln CVE-2026-27205 \
            --ignore-vuln CVE-2025-43859 \
            --ignore-vuln CVE-2025-6176 \
            --ignore-vuln CVE-2026-27448 \
            --ignore-vuln CVE-2026-49854 \
            --ignore-vuln CVE-2026-49853 \
            --ignore-vuln CVE-2026-49855 \
            --ignore-vuln GHSA-pw6j-qg29-8w7f

  bandit:
    name: bandit (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      # B310 (urlopen scheme audit) is suppressed because every urlopen call
      # in this codebase points at a hardcoded loopback URL or a fixed
      # trusted upstream (PyPI, OSV, ThreatFox) — never user input.
      - run: bandit -r src/ -s B101,B404,B603,B607,B310 --severity-level medium

  trufflehog:
    name: trufflehog (secret history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # --only-verified blocks on credentials TruffleHog could actually
      # authenticate with (live, not example/test). Pattern-only matches
      # still print as warnings but do not fail the gate.
      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
