name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      # Component 3 of the spec-driven-enforcement PR. AST-walker for
      # patterns ruff can't express (bare except, mutable defaults,
      # subprocess shell=True, missing docstrings, etc.). Existing
      # violations are baselined in scripts/check_design_patterns_baseline.txt;
      # the gate fails only on new violations not in the baseline.
      - name: Design pattern checks
        run: python scripts/check_design_patterns.py

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # Coverage gate is currently 70% (actual: ~72%). Target is 90% — being
      # raised progressively as the sprint adds tests for security.py, the
      # setup wizard, watch.py mitmproxy paths, and sync.py (currently 0%).
      - run: pytest --cov=claude_monitoring --cov-report=xml --cov-fail-under=70
      - uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      # B310 (urlopen scheme audit) is suppressed because every urlopen call
      # in this codebase points at a hardcoded loopback URL or a fixed
      # trusted upstream (PyPI, OSV, ThreatFox) — never user input.
      - run: bandit -r src/ -s B101,B404,B603,B607,B310 --severity-level medium

  # Phase 3B Q1 coverage ratchet: PRs cannot drop line coverage by more
  # than 0.1pp or branch coverage by more than 0.5pp vs the base branch.
  # Runs only on pull_request events (the comparison needs a base ref).
  coverage-ratchet:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Coverage on base branch
        run: |
          git checkout "origin/${BASE_REF}"
          # --cov-fail-under=0 disables the hard gate for the BASE
          # measurement; the ratchet itself enforces the delta rule.
          # Clear all caches so stale .pyc files from previous run
          # don't perturb coverage tracking under sys.settrace.
          rm -rf .pytest_cache .coverage coverage.xml
          find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          pytest --cov=claude_monitoring --cov-report=xml --cov-fail-under=0 -q
          mv coverage.xml coverage-base.xml
      - name: Coverage on PR branch
        run: |
          git checkout -
          rm -rf .pytest_cache .coverage coverage.xml
          find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          pytest --cov=claude_monitoring --cov-report=xml --cov-fail-under=0 -q
      - name: List PR-modified src files
        run: |
          git diff --name-only "origin/${BASE_REF}...HEAD" -- src/ > changed.txt
          echo "Modified src files:"
          cat changed.txt || true
      - name: Ratchet check
        run: python scripts/coverage_ratchet.py coverage-base.xml coverage.xml changed.txt

  # Component 5 of the spec-driven-enforcement PR. Reads PR diff, walks
  # the .github/spec-requirements.yaml rule table, fails on BLOCK
  # violations. WARN violations emit messages but don't fail the job.
  # Three-dot diff syntax intentional — gives the PR changes, not the
  # merge-base diff (which would include upstream changes not in the PR).
  spec-requirements:
    name: spec-requirements
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Generate PR diff
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" > /tmp/pr.patch
      - name: Check spec requirements
        run: python scripts/check_spec_requirements.py --diff /tmp/pr.patch
