name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # Coverage gate is currently 70% (actual: ~72%). Target is 90% — being
      # raised progressively as the sprint adds tests for security.py, the
      # setup wizard, watch.py mitmproxy paths, and sync.py (currently 0%).
      - run: pytest --cov=claude_monitoring --cov-report=xml --cov-fail-under=70
      - uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      # B310 (urlopen scheme audit) is suppressed because every urlopen call
      # in this codebase points at a hardcoded loopback URL or a fixed
      # trusted upstream (PyPI, OSV, ThreatFox) — never user input.
      - run: bandit -r src/ -s B101,B404,B603,B607,B310 --severity-level medium
