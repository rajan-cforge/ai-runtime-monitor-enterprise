# Phase 3B Quality Gates Q1 — pre-commit hooks.
#
# Scope is intentionally narrow per the Q1/Q2/Q3 triage in
# docs/RECONCILIATION_LOG.md:
#   Q1 (this file): hygiene + ruff + bandit + detect-secrets + conventional commit
#   Q2 (later):     mypy non-strict, expanded ruff categories, interrogate
#   Q3 (later):     gitsign signed commits, mutation testing
#
# Install on a fresh clone:
#   make pre-commit-install
#
# Run against every tracked file:
#   make pre-commit-run
#
# Bypass via `git commit --no-verify` is permitted locally but CI runs
# the same checks on push, so bypassing only delays the failure.

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
fail_fast: false

repos:
  # ─── Layer 1: file hygiene ─────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-symlinks
      - id: detect-private-key
      - id: forbid-new-submodules
      - id: mixed-line-ending
        args: ['--fix=lf']

  # ─── Layer 2: secrets ──────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: |
          (?x)^(
            package-lock\.json|
            .*\.lock|
            \.secrets\.baseline
          )$

  # ─── Layer 3: Python ───────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml']
        exclude: ^tests/

  # ─── Layer 3: commit message ───────────────────────────────────
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
